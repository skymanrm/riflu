name: release

# Publishing a GitHub release builds the macOS and Windows apps and attaches
# them to it. The app version is taken from the release tag (v1.2.3 → 1.2.3).

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Resolve version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # .app only: the .dmg bundler drives Finder over AppleScript and needs
      # automation rights. Zipped with ditto to keep symlinks and exec bits.
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          npm run tauri build -- --target ${{ matrix.target }} --bundles app \
            --config "{\"version\":\"$VERSION\"}"
          ditto -c -k --keepParent \
            "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Riflu.app" \
            "Riflu-$TAG-macos-universal.zip"
          echo "ASSET=Riflu-$TAG-macos-universal.zip" >> "$GITHUB_ENV"

      # NSIS only. The MSI bundler needs WiX and buys nothing here.
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: |
          npm run tauri build -- --target ${{ matrix.target }} --bundles nsis \
            --config "{\"version\":\"$VERSION\"}"
          cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe \
            "Riflu-$TAG-windows-x64-setup.exe"
          echo "ASSET=Riflu-$TAG-windows-x64-setup.exe" >> "$GITHUB_ENV"

      - name: Attach to release
        run: gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
