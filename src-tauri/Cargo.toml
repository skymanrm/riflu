[package]
name = "riflu"
version = "0.1.0"
description = "A clean open-source Yandex Music player"
authors = ["Andrey"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "riflu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
md-5 = "0.10"
hex = "0.4"
roxmltree = "0.20"
thiserror = "2"
rand = "0.8"
# Same resolver Tauri uses for `app_config_dir`, so `store.rs` and
# `settings.rs` always land in the same directory on every platform.
dirs = "6"

# The island: a non-activating panel above the menu bar, sized to the notch.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSScreen", "NSResponder", "NSGraphics", "NSPanel", "NSButton", "NSControl", "NSView"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
