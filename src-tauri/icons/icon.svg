<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a33"/>
      <stop offset="1" stop-color="#0b0b0e"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sun" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff176"/>
      <stop offset="0.45" stop-color="#ffcc00"/>
      <stop offset="1" stop-color="#ff7a00"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb300" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#ffb300" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffb300" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
    <clipPath id="disc">
      <circle cx="512" cy="470" r="240"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base tile, with the drop shadow macOS icons carry -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#squircle)">
    <!-- Warm glow behind the disc -->
    <circle cx="512" cy="470" r="400" fill="url(#glow)"/>

    <!-- The disc, cut by waves -->
    <g clip-path="url(#disc)">
      <rect x="200" y="200" width="624" height="624" fill="url(#sun)"/>
      <g fill="none" stroke="#141418" stroke-linecap="round">
        <path d="M200 530 C 300 480, 400 480, 512 530 S 724 580, 824 530" stroke-width="30"/>
        <path d="M200 608 C 300 558, 400 558, 512 608 S 724 658, 824 608" stroke-width="40"/>
        <path d="M200 688 C 300 638, 400 638, 512 688 S 724 738, 824 688" stroke-width="52"/>
      </g>
    </g>

    <!-- Waves continuing past the disc, fading into the tile -->
    <g fill="none" stroke-linecap="round" stroke="#ffcc00">
      <path d="M40 770 C 200 700, 360 700, 512 770 S 824 840, 984 770" stroke-width="18" stroke-opacity="0.7"/>
      <path d="M40 836 C 200 766, 360 766, 512 836 S 824 906, 984 836" stroke-width="13" stroke-opacity="0.35"/>
    </g>

    <!-- Glass rim along the top edge -->
    <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="url(#rim)" stroke-width="3"/>
  </g>
</svg>
