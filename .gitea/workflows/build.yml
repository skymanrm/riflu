name: build

# Windows binaries cannot be cross-compiled from macOS — Tauri needs MSVC, the
# Windows SDK and WebView2 — so the Windows build lives here. Needs a Gitea
# runner registered with the `windows-latest` label, running in host mode
# (not Docker).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    # Host mode gives each job a new random workdir, so a cached target/ keeps
    # dead absolute paths; a fixed target dir on the runner's disk does not.
    env:
      CARGO_TARGET_DIR: C:\cargo-target\yamusic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Self-hosted runners rarely come with Rust, and rustup is a no-op when
      # the toolchain is already there.
      - name: Install Rust
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain stable --profile minimal
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          else { rustup toolchain install stable --profile minimal }

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --lib

      # The target dir persists, so drop installers left by earlier versions.
      - name: Clean old bundles
        shell: pwsh
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:CARGO_TARGET_DIR\release\bundle"

      # NSIS only. The MSI bundler needs WiX and buys nothing here.
      - name: Build installer
        run: npm run tauri build -- --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: riflu-windows
          path: ${{ env.CARGO_TARGET_DIR }}\release\bundle\nsis\*-setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          else
            rustup toolchain install stable --profile minimal
          fi

      # Same host-mode workdir issue as Windows: keep target/ at a fixed path.
      - name: Set target dir
        run: |
          echo "CARGO_TARGET_DIR=$HOME/Library/Caches/cargo-target/yamusic" >> "$GITHUB_ENV"
          rm -rf "$HOME/Library/Caches/cargo-target/yamusic/release/bundle"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --lib

      # .app only: the .dmg bundler drives Finder over AppleScript, which has
      # no automation rights on a runner. It fails on this Mac too.
      - name: Build app
        run: npm run tauri build -- --bundles app

      # Zipped rather than uploaded raw, so the bundle keeps its symlinks and
      # executable bits.
      - name: Zip the bundle
        run: |
          ditto -c -k --keepParent \
            "$CARGO_TARGET_DIR/release/bundle/macos/Riflu.app" riflu-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: riflu-macos
          path: riflu-macos.zip
          if-no-files-found: error
